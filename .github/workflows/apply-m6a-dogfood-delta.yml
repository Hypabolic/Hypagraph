name: Apply M6A dogfood delta

on:
  push:
    branches:
      - agent/m6a-slice-2-direct-gates
    paths:
      - ".agent/m6a-dogfood-delta.patch"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact dogfood delta
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .agent/m6a-dogfood-delta.patch
          git apply .agent/m6a-dogfood-delta.patch
          rm .agent/m6a-dogfood-delta.patch
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update release dogfood for deterministic gates"
          git push origin HEAD:${GITHUB_REF_NAME}
