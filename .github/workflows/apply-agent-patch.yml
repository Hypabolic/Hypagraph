name: Apply agent patch

on:
  push:
    branches:
      - agent/m6a-slice-2-direct-gates
    paths:
      - ".agent/m6a.patch.gz.b64.part*"
      - ".github/workflows/apply-agent-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .agent/m6a.patch.gz.b64.part1 ]; then
            exit 0
          fi
          cat .agent/m6a.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/m6a.patch
          git apply --check /tmp/m6a.patch
          git apply /tmp/m6a.patch
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .agent/m6a.patch.gz.b64.part*
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Dispatch ready gates without model turns"
          git push origin HEAD:${GITHUB_REF_NAME}
