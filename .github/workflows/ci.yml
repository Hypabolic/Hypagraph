name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  apply-dogfood-delta:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/m6a-slice-2-direct-gates'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/m6a-slice-2-direct-gates
          fetch-depth: 0
      - name: Apply exact dogfood delta
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .agent/m6a-dogfood-delta.patch ]; then
            exit 0
          fi
          git apply --check .agent/m6a-dogfood-delta.patch
          git apply .agent/m6a-dogfood-delta.patch
          rm .agent/m6a-dogfood-delta.patch
          rmdir .agent 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update release dogfood for deterministic gates"
          git push origin HEAD:agent/m6a-slice-2-direct-gates

  check:
    name: ${{ matrix.os }} · Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node-version:
          - 22
          - 24

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run type checks and tests
        id: check
        shell: bash
        run: |
          set +e
          npm run check > check.log 2>&1
          status=$?
          cat check.log
          exit $status

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: check.log
